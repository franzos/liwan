base_url = "http://localhost:9042"  # The base URL of the Liwan instance
listen = 9042  # The port to listen on (http)

## Disable favicon fetching from the DuckDuckGo API.
# disable_favicons = false

## Folder to store the database in (Will be created if it doesn't exist)
## defaults to $HOME/.local/share/liwan/data on linux/macos
## defaults to ./liwan-data on other platforms
# data_dir="./liwan-data"

## Trusted client IP headers (used in order), defaults to X-Forwarded-For.
## Presets: cloudflare, fastly, fly, cloudfront, akamai.
## Provider presets can be combined with standard or custom headers.
# trusted_headers = ["X-Forwarded-For"]

## Trusted reverse proxies (IP or CIDR), defaults to the IPv4 and IPv6 loopback ranges.
## Use "*" to trust all direct peers only when network access to liwan is restricted.
# trusted_proxies = ["127.0.0.1/8", "::1/128"]

## Hour of day, in the server's local timezone, when visitor grouping salts rotate.
## Defaults to 4, meaning 4am local time.
# visitor_group_rotation_hour=4

[geoip]  # GeoIp settings (Optional)
## MaxMind account ID and license key
## Required to automatically download the database and keep it up to date
# maxmind_account_id="MY_ACCOUNT_ID"
# maxmind_license_key="MY_LICENSE_KEY"
# maxmind_edition="GeoLite2-City"

## If you don't want to automatically download the database, you can specify a path to a local file
## Otherwise, the database will be downloaded automatically and stored in the data_dir
# maxmind_db_path="./GeoLite2-City.mmdb"

## Read location data supplied by a trusted proxy.
## Presets: akamai, cloudflare, cloudfront, netlify, vercel.
## Multiple presets and custom mappings are also supported, in priority order:
# headers=["cloudflare", { country="X-Country", city="X-City" }]
# headers="cloudflare"

[duckdb]  # Database settings
## See https://liwan.dev/guides/duckdb for guidance
# threads=2
# memory_limit=2G

[limits]  # Resource limits for dashboard reports.
# report_timeout_seconds=30
# report_max_concurrency=8
# report_max_range_days=3660
# report_max_dimension_results=1000
# report_max_datapoints=2000
# report_max_filters=20
# report_max_filter_value_bytes=2048

# Per-client rate limits (Optional)
# Each client gets a token bucket: `burst` requests up front, one more every
# `period`. Clients are keyed on the forwarded IP when the peer is listed in
# trusted_proxies, and on the TCP peer otherwise.
[rate_limit]
# Login and setup: 5 requests, then one every 2 seconds.
# auth_period_seconds=2
# auth_burst=5

# Event ingest: 100 requests, then one every 50ms (20/s sustained).
# event_period_ms=50
# event_burst=100

# Single sign-on (Optional)
# Each [oidc.providers.<name>] table adds a button to the login page. <name> is
# lowercase letters, digits and hyphens; it appears in the start URL, in the
# webhook URLs and in env var names, so prefer one without hyphens if the secret
# comes from the environment. Password login keeps working alongside SSO.
#
# Register this redirect URI with every provider (derived from base_url):
#   <base_url>/api/dashboard/auth/external/callback
# The per-provider back-channel logout and account-deletion URLs are logged at
# startup.

# [oidc.providers.company]
# kind                = "oidc"                    # oidc (default) | forseti | google | microsoft
# display_name        = "Company SSO"             # defaults to the kind's name
# issuer              = "https://idp.example.com" # oidc and forseti; discovery lives under it
# client_id           = "liwan"
# client_secret       = "..."                     # prefer LIWAN_OIDC_PROVIDERS_COMPANY_CLIENT_SECRET
# scopes              = ["openid", "email", "profile"]  # oidc only; this is the default
# allow_session_reuse = true                      # false sends prompt=login, forcing re-authentication
# registration        = "open"                    # open (default) | closed
#
# Email domains permitted to sign in, checked on every login (not just sign-up).
# Needs the "email" scope; an unverified email never qualifies. Matching is exact
# and case-insensitive, so subdomains do not match. Use punycode for IDN domains.
# allowed_domains     = ["example.com", "acme.org"]

# Map IdP groups onto liwan roles and project access. Only applied to accounts
# without a local password, and rewritten on every login — so a group change at
# the IdP takes effect at the next sign-in, and local edits to such an account
# do not survive it.
# [oidc.providers.company.groups]
# claim    = "groups"                             # the claim to read; this is the default
# allowed  = ["analytics"]                        # optional: must be in one of these to sign in
# admin    = ["liwan-admins"]                     # members get role admin, everyone else user
# projects = { marketing = ["blog", "docs"], eng = ["app"] }

# Forseti (https://github.com/franzos/forseti) adds group-driven access, a
# manage-account link on the settings page, and an account-deletion webhook.
# [oidc.providers.company]
# kind       = "forseti"
# issuer     = "https://hydra.example.com"        # Forseti's OIDC issuer
# portal_url = "https://accounts.example.com"     # optional; Forseti's own URL, defaults to issuer
# client_id  = "liwan"

# Google Workspace. allowed_domains restricts to your Workspace domains.
# [oidc.providers.google]
# kind      = "google"
# client_id = "....apps.googleusercontent.com"

# Microsoft Entra ID. tenant_id must be the tenant UUID, not "common".
# [oidc.providers.entra]
# kind      = "microsoft"
# tenant_id = "72f988bf-86f1-41af-91ab-2d7cd011db47"
# client_id = "..."

