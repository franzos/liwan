[advisories]
# RUSTSEC-2023-0071 (Marvin, rsa): no fixed release. Reached only through
# openidconnect, where liwan verifies IdP signatures with public keys and never
# performs a private-key decryption, which is what the timing attack recovers.
ignore=["RUSTSEC-2023-0071"]
informational_warnings=["unsound"]
severity_threshold="low"

[target]
arch=["x86_64", "aarch64"]
os=["linux", "windows", "apple"]

[yanked]
enabled=true
update_index=true
